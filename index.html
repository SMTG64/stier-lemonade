<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fff4b8" />
<title>S Tier Lemonade — Delivery</title>
<style>
  :root{--ink:#17352c;--green:#255b48;--green2:#36795b;--yellow:#ffe56e;--yellow2:#fff4b8;--cream:#fffdf5;--pink:#ffd4d5;--lilac:#e5ddff;--line:#e8e3cf;--muted:#6b786f;--white:#fff;--shadow:0 12px 35px rgba(38,65,48,.09)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Avenir Next",Avenir,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  .app{max-width:1180px;margin:0 auto;padding:0 22px 38px}
  header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:48px;height:48px;border-radius:17px;background:var(--yellow);display:grid;place-items:center;font-size:27px;box-shadow:inset 0 -4px 0 rgba(186,142,0,.14);flex-shrink:0}
  .brand h1{font-size:19px;letter-spacing:-.5px;line-height:1.1;margin:0;font-weight:950}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:12px;font-weight:650}
  nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .nav-btn{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 13px;font-weight:800;font-size:13px}
  .nav-btn.active{background:var(--yellow2);color:var(--ink)}
  .cart-nav{background:var(--green);color:#fff;border:0;border-radius:13px;padding:11px 14px;font-weight:850;font-size:13px;white-space:nowrap}
  .cart-nav span{display:inline-grid;place-items:center;min-width:21px;height:21px;margin-left:6px;padding:0 5px;background:var(--yellow);color:var(--ink);border-radius:9px}
  .hero{margin:25px 0 28px;display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:stretch}
  .hero-copy{background:var(--yellow2);border:1px solid #f2e28e;border-radius:28px;padding:34px;position:relative;overflow:hidden;min-height:275px}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.67);border-radius:99px;padding:8px 12px;font-size:11px;font-weight:950;letter-spacing:1px;text-transform:uppercase}
  h2{font-size:clamp(32px,5vw,54px);line-height:.99;letter-spacing:-2px;margin:19px 0 15px;max-width:570px}
  .hero-copy>p{color:#4d6253;line-height:1.55;max-width:440px;margin:0 0 22px;font-size:15px;font-weight:560}
  .primary{background:var(--green);color:#fff;border:0;border-radius:13px;padding:13px 18px;font-weight:900;box-shadow:0 4px 0 rgba(23,53,44,.13)}
  .primary:hover{background:var(--green2);transform:translateY(-1px)}
  .secondary{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:800}
  .hero-art{background:#d9efdc;border-radius:28px;position:relative;overflow:hidden;min-height:275px;display:grid;place-items:center}
  .sun{position:absolute;width:210px;height:210px;border-radius:50%;background:#fff6ad;right:-35px;top:-35px}
  .lemon-doodle{font-size:104px;z-index:1;filter:drop-shadow(0 15px 10px rgba(28,69,47,.13));transform:rotate(-14deg)}
  .art-caption{position:absolute;bottom:18px;left:18px;right:18px;z-index:2;background:rgba(255,255,255,.83);border-radius:15px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:9px;font-size:12px;font-weight:850}
  .art-caption strong{font-size:14px}
  .section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 17px}
  .section-heading h3{font-size:26px;letter-spacing:-.9px;margin:0}
  .section-heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
  .shop-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}
  .products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
  .product{background:#fff;border:1px solid var(--line);border-radius:21px;padding:13px;box-shadow:0 4px 18px rgba(38,65,48,.025);display:flex;flex-direction:column;min-width:0}
  .product-art{min-height:145px;border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden}
  .product-art:before{content:"";position:absolute;width:135px;height:135px;border:1px dashed rgba(23,53,44,.12);border-radius:50%}
  .product-art .drink{font-size:67px;position:relative;z-index:1;filter:drop-shadow(0 9px 8px rgba(25,52,39,.12))}
  .tag{position:absolute;top:10px;left:10px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.84);font-size:9px;letter-spacing:.7px;text-transform:uppercase;font-weight:950}
  .product-info{padding:13px 3px 3px;display:flex;flex-direction:column;flex:1}
  .product-title-row{display:flex;justify-content:space-between;align-items:start;gap:8px}
  .product h4{margin:0;font-size:16px;letter-spacing:-.3px}
  .price{font-size:15px;font-weight:950;white-space:nowrap}
  .product p{color:var(--muted);font-size:12px;line-height:1.45;margin:7px 0 14px;flex:1}
  .add-btn{background:#eef5ed;border:0;color:var(--green);border-radius:11px;padding:10px;font-weight:900;font-size:12px;width:100%}
  .add-btn:hover{background:var(--yellow2)}
  .cart-box{position:sticky;top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
  .cart-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cart-title h3{font-size:19px;margin:0;letter-spacing:-.5px}
  .cart-count{font-size:11px;font-weight:850;background:var(--yellow2);padding:6px 9px;border-radius:9px}
  .empty{padding:23px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}
  .empty .empty-icon{font-size:36px;display:block;margin-bottom:8px}
  .cart-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #f0ecdd}
  .cart-item strong{display:block;font-size:13px}
  .cart-item small{color:var(--muted);font-size:11px}
  .qty{display:flex;align-items:center;gap:9px;margin-top:8px}
  .qty button{border:1px solid var(--line);background:#fff;border-radius:8px;width:25px;height:25px;font-weight:900;color:var(--ink)}
  .qty b{font-size:12px}
  .cart-line-price{font-weight:900;font-size:13px;padding-top:2px}
  .totals{padding:15px 0 4px;display:grid;gap:9px;font-size:12px}
  .total-row{display:flex;justify-content:space-between;gap:12px;color:#5f6e64}
  .total-row.grand{border-top:1px solid var(--line);padding-top:12px;margin-top:3px;font-size:16px;font-weight:950;color:var(--ink)}
  .cart-box .primary{width:100%;margin-top:12px}
  .fine-print{font-size:10px;color:var(--muted);line-height:1.5;margin:12px 0 0}
  .pill{font-size:10px;font-weight:900;border-radius:99px;padding:6px 9px;display:inline-block;background:#e8f5e8;color:#2e664b}
  .page{padding:31px 0;min-height:400px}
  .page-shell{max-width:780px;margin:0 auto}
  .page-title{font-size:34px;letter-spacing:-1.5px;margin:0 0 7px}
  .page-sub{color:var(--muted);margin:0 0 24px;line-height:1.5}
  .panel{border:1px solid var(--line);background:#fff;border-radius:21px;padding:23px;margin-bottom:18px}
  .panel h3{font-size:18px;margin:0 0 17px;letter-spacing:-.4px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .field.full{grid-column:1/-1}
  .field label{font-weight:850;font-size:12px}
  .field input,.field textarea,.field select{width:100%;border:1px solid #dddcca;border-radius:11px;padding:12px;background:#fffef9;outline:none;color:var(--ink)}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(54,121,91,.12)}
  .field textarea{min-height:76px;resize:vertical}
  .hint{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
  .checkout-layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  .checkout-summary{background:#f6f6e9;border-radius:16px;padding:17px}
  .checkout-summary h4{font-size:14px;margin:0 0 12px}
  .checkout-summary .total-row{font-size:12px;margin:9px 0}
  .notice{background:#fff7d5;border:1px solid #f1e39e;border-radius:13px;padding:13px 14px;font-size:12px;line-height:1.5;color:#536044;margin-bottom:15px}
  .receipt-top{background:var(--yellow2);border-radius:20px;padding:24px;text-align:center;margin-bottom:18px}
  .receipt-check{margin:0 auto 12px;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#fff;font-size:27px}
  .receipt-top h2{font-size:32px;letter-spacing:-1px;margin:0 0 7px;max-width:none}
  .receipt-top p{margin:0;color:#536044;font-size:13px}
  .receipt-id{font-size:12px;font-weight:950;letter-spacing:1px;background:#fff9df;display:inline-block;padding:8px 12px;border-radius:9px;margin-top:13px}
  .order-card{border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0;background:#fff}
  .order-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
  .order-head strong{font-size:14px}
  .order-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
  .status{font-size:10px;font-weight:950;padding:6px 8px;border-radius:8px;background:#f1eee3;white-space:nowrap}
  .status.Pending{background:#fff0bd;color:#715700}.status.Preparing{background:#e5ddff;color:#4c3896}.status.Out-for-delivery{background:#d8edff;color:#225a7b}.status.Delivered{background:#dff3dc;color:#2b6943}.status.Cancelled{background:#ffe0e0;color:#883d3d}
  .order-items{color:#516258;font-size:12px;line-height:1.65;margin:12px 0}
  .order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .order-actions select{max-width:190px;border:1px solid var(--line);border-radius:10px;padding:9px;background:white;font-size:12px}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;background:#f6f6e9;border-radius:13px;margin-bottom:15px}
  .toggle-row strong{font-size:13px;display:block}.toggle-row small{color:var(--muted);font-size:11px}
  .switch{width:47px;height:27px;border:0;border-radius:99px;background:#c4c9c3;padding:3px;flex-shrink:0}.switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--green2)}.switch.on:after{transform:translateX(20px)}
  .footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:36px;padding-top:22px;color:var(--muted);font-size:11px;line-height:1.5}
  .footer strong{color:var(--ink)}
  .toast{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 17px;font-size:12px;font-weight:800;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 30px)}
  .hidden{display:none!important}
  .empty-owner{text-align:center;padding:28px;color:var(--muted);font-size:13px}
  .danger{color:#974343;border-color:#efcece;background:#fffafa}
  @media(max-width:850px){.hero{grid-template-columns:1fr .7fr}.shop-layout{grid-template-columns:minmax(0,1fr) 285px;gap:16px}.cart-box{padding:16px}.hero-copy{padding:27px}}
  @media(max-width:680px){.app{padding:0 14px 28px}header{align-items:flex-start;flex-wrap:wrap;padding:15px 0;gap:12px}.brand{flex:1}nav{order:3;width:100%;justify-content:space-between;gap:3px} .nav-btn{padding:9px 10px;font-size:12px}.cart-nav{padding:10px 12px}.hero{grid-template-columns:1fr;margin-top:17px;gap:12px}.hero-copy{padding:24px;min-height:0}.hero-art{min-height:185px}.lemon-doodle{font-size:78px}.sun{width:155px;height:155px}.shop-layout{grid-template-columns:1fr}.cart-box{position:static;order:2}.products{gap:10px}.product{padding:9px;border-radius:17px}.product-art{min-height:110px}.product-art .drink{font-size:54px}.product h4{font-size:14px}.product p{font-size:11px}.section-heading h3{font-size:23px}.checkout-layout{grid-template-columns:1fr}.form-grid,.settings-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:16px}.page{padding-top:23px}.page-title{font-size:30px}.hero-copy h2{font-size:40px}.footer{margin-top:25px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">🍋</div><div><h1>S Tier Lemonade</h1><p>Freshly squeezed. Delivered with a smile.</p></div></div>
  <button class="cart-nav" data-action="go-cart">Your cart <span id="nav-count">0</span></button>
  <nav aria-label="Main navigation">
    <button class="nav-btn active" data-view="shop">Shop</button>
    <button class="nav-btn" data-view="orders">My orders</button>
    <button class="nav-btn" data-view="owner">Stand manager</button>
  </nav>
</header>
<main id="app-main" aria-live="polite"></main>
<footer class="footer"><div><strong>S Tier Lemonade</strong><br>Made for sunny days ☀️</div><div>Cash at delivery · No card details collected<br>Delivery only in an adult-approved local area.</div></footer>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
// QUICK SETUP: Configure your order email in Stand manager, then download a shareable copy.
// The downloaded copy includes that email so customers can send orders from other devices.
const DEFAULT_ORDER_EMAIL = "";
const DEFAULT_DELIVERY_FEE = 1.5;
const DEFAULT_FREE_DELIVERY_AT = 12;
const DEFAULT_MINIMUM_ORDER = 3;
const DEFAULT_STAND_OPEN = true;
const STORAGE = {cart:'stier.cart.v1',orders:'stier.orders.v1',settings:'stier.settings.v1'};
const PRODUCTS = [
 {id:'classic-lemonade',name:'Normal Lemonade',price:1.00,description:'Classic, refreshing lemonade for a sunny day.',emoji:'🍋',color:'#fff4b8',tag:'Classic favorite'},
 {id:'berry-blast',name:'Berry Blast',price:1.25,description:'A bold, juicy berry flavor with a bright lemonade kick.',emoji:'🫐',color:'#f6d9f0',tag:'Berry favorite'},
 {id:'orange-tangerine',name:'Orange Tangerine',price:1.25,description:'Sweet orange and tangy tangerine in one sunny sip.',emoji:'🍊',color:'#ffe0b8',tag:'Citrus burst'},
 {id:'fruit-punch',name:'Fruit Punch',price:1.25,description:'A colorful, fruity blend bursting with flavor.',emoji:'🍹',color:'#ffd8c9',tag:'Fruity favorite'},
 {id:'arctic-grape',name:'Arctic Grape',price:1.25,description:'A cool, crisp grape flavor with a frosty vibe.',emoji:'🍇',color:'#e5ddff',tag:'Cool & bold'},
 {id:'strawberry-lemonade',name:'Strawberry Lemonade',price:1.25,description:'Sweet strawberry meets refreshing, zesty lemonade.',emoji:'🍓',color:'#ffd9dc',tag:'Strawberry favorite'}
];
let view='shop';
let cart=load(STORAGE.cart,{});
let orders=load(STORAGE.orders,[]);
let settings={email:DEFAULT_ORDER_EMAIL,deliveryFee:DEFAULT_DELIVERY_FEE,freeDeliveryAt:DEFAULT_FREE_DELIVERY_AT,minimumOrder:DEFAULT_MINIMUM_ORDER,open:DEFAULT_STAND_OPEN,...load(STORAGE.settings,{})};
let currentOrderId=null;
let toastTimer=null;
const main=document.getElementById('app-main');
const money=n=>'$'+Number(n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(key,fallback){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function allCart(){return Object.entries(cart).map(([id,qty])=>{const p=PRODUCTS.find(p=>p.id===id);return p?{...p,qty:Number(qty)||0}:null}).filter(x=>x&&x.qty>0)}
function subtotal(){return allCart().reduce((n,p)=>n+p.price*p.qty,0)}
function deliveryFee(){return subtotal()===0||subtotal()>=Number(settings.freeDeliveryAt)?0:Number(settings.deliveryFee)}
function total(){return subtotal()+deliveryFee()}
function count(){return allCart().reduce((n,p)=>n+p.qty,0)}
function sync(){save(STORAGE.cart,cart);save(STORAGE.orders,orders);save(STORAGE.settings,settings);document.getElementById('nav-count').textContent=count()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function setView(next){view=next;render()}
function changeQty(id,delta){cart[id]=(Number(cart[id])||0)+delta;if(cart[id]<=0)delete cart[id];sync();render()}
function cartItemsHtml(){const items=allCart();if(!items.length)return '<div class="empty"><span class="empty-icon">🧺</span>Your cart is taking a lemonade break.<br>Add a drink to get started!</div>';return items.map(p=>`<div class="cart-item"><div><strong>${p.emoji} ${esc(p.name)}</strong><small>${money(p.price)} each</small><div class="qty"><button data-action="qty" data-id="${p.id}" data-delta="-1" aria-label="Remove one ${esc(p.name)}">−</button><b>${p.qty}</b><button data-action="qty" data-id="${p.id}" data-delta="1" aria-label="Add one ${esc(p.name)}">+</button></div></div><div class="cart-line-price">${money(p.price*p.qty)}</div></div>`).join('')}
function totalsHtml(){return `<div class="totals"><div class="total-row"><span>Subtotal</span><strong>${money(subtotal())}</strong></div><div class="total-row"><span>Delivery ${subtotal()>=Number(settings.freeDeliveryAt)&&subtotal()>0?'(free over '+money(settings.freeDeliveryAt)+')':''}</span><strong>${deliveryFee()===0?'FREE':money(deliveryFee())}</strong></div><div class="total-row grand"><span>Total</span><strong>${money(total())}</strong></div></div>`}
function cartBox(){return `<aside class="cart-box" id="cart-box"><div class="cart-title"><h3>Your cart 🥤</h3><span class="cart-count">${count()} item${count()===1?'':'s'}</span></div>${cartItemsHtml()}${allCart().length?totalsHtml():''}<button class="primary" data-action="checkout" ${allCart().length?'':'disabled style="opacity:.45;cursor:not-allowed"'}>${settings.open?'Continue to delivery →':'Stand is closed'}</button><p class="fine-print">${settings.open?'Cash at delivery. Free delivery on orders over '+money(settings.freeDeliveryAt)+'.':'The stand is currently closed. Check back later.'} No online payments.</p></aside>`}
function renderShop(){return `<section class="hero"><div class="hero-copy"><span class="eyebrow">☀️ SUNNY-DAY SPECIALISTS</span><h2>A little sip of <span style="color:#a96f00">sunshine.</span></h2><p>Pick your favorite lemonade, add your delivery details, and we’ll help get your refreshment rolling.</p><button class="primary" data-action="scroll-menu">Explore the menu ↓</button></div><div class="hero-art"><div class="sun"></div><div class="lemon-doodle">🍋</div><div class="art-caption"><span><strong>Fresh vibes only</strong><br>Made for sunny days</span><span style="font-size:25px">💛</span></div></div></section><section><div class="section-heading"><div><h3>The lemonade lineup</h3><p>Choose your sips. Every cup adds a little sunshine.</p></div><span class="pill">${settings.open?'● Taking orders':'● Currently closed'}</span></div><div class="shop-layout"><div class="products" id="menu-grid">${PRODUCTS.map(p=>`<article class="product"><div class="product-art" style="background:${p.color}"><span class="tag">${esc(p.tag)}</span><span class="drink">${p.emoji}</span></div><div class="product-info"><div class="product-title-row"><h4>${esc(p.name)}</h4><span class="price">${money(p.price)}</span></div><p>${esc(p.description)}</p><button class="add-btn" data-action="add" data-id="${p.id}" ${settings.open?'':'disabled style="opacity:.45;cursor:not-allowed"'}>＋ Add to cart</button></div></article>`).join('')}</div>${cartBox()}</div></section>`}
function checkoutSummary(){return `<div class="checkout-summary"><h4>Order summary</h4>${allCart().map(p=>`<div class="total-row"><span>${p.qty} × ${esc(p.name)}</span><strong>${money(p.qty*p.price)}</strong></div>`).join('')}${totalsHtml()}<p class="hint">Cash is due at delivery. Please have the exact amount ready if possible.</p></div>`}
function renderCheckout(){if(!allCart().length){view='shop';return renderShop()}return `<section class="page"><div class="page-shell"><button class="secondary" data-view="shop">← Back to menu</button><h2 class="page-title" style="margin-top:20px">Delivery details</h2><p class="page-sub">Tell us where to bring your lemonade. Double-check your address before placing the order.</p><div class="notice">🔒 This demo collects no card details. Use a parent/guardian-approved contact method and only request deliveries in an adult-approved local area.</div><div class="checkout-layout"><form id="checkout-form" class="panel"><h3>Where should we deliver?</h3><div class="form-grid"><div class="field"><label for="customer-name">Your name *</label><input id="customer-name" name="name" required maxlength="70" autocomplete="name" placeholder="Name for the order" /></div><div class="field"><label for="customer-phone">Phone number *</label><input id="customer-phone" name="phone" type="tel" required maxlength="25" autocomplete="tel" placeholder="Best number to reach you" /></div><div class="field full"><label for="customer-address">Delivery address *</label><input id="customer-address" name="address" required maxlength="160" autocomplete="street-address" placeholder="Street address and house number" /></div><div class="field"><label for="customer-city">Town / neighborhood *</label><input id="customer-city" name="city" required maxlength="80" autocomplete="address-level2" placeholder="Town or neighborhood" /></div><div class="field"><label for="customer-zip">ZIP code *</label><input id="customer-zip" name="zip" required maxlength="10" autocomplete="postal-code" placeholder="ZIP code" /></div><div class="field full"><label for="customer-notes">Delivery notes (optional)</label><textarea id="customer-notes" name="notes" maxlength="300" placeholder="Gate, porch, or other helpful details — no special requests guaranteed."></textarea></div><div class="field full"><label for="customer-time">Preferred delivery time</label><select id="customer-time" name="time"><option>As soon as possible</option><option>In 30–45 minutes</option><option>In about 1 hour</option><option>Contact me to arrange a time</option></select><span class="hint">This is a request, not a guaranteed time. We’ll confirm by email.</span></div></div><div style="display:flex;align-items:start;gap:10px;margin:18px 0 5px"><input type="checkbox" id="safe-area" required style="margin-top:3px" /><label for="safe-area" class="hint">I confirm this is within the stand’s adult-approved delivery area. *</label></div><button class="primary" type="submit" style="width:100%;margin-top:15px">Place order · ${money(total())}</button><p class="hint" style="margin-bottom:0">Placing the order saves a receipt in this browser. To notify the stand, the next screen will let you open a pre-filled email and press Send.</p></form>${checkoutSummary()}</div></div></section>`}
function statusClass(status){return String(status||'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')}
function formatOrder(o){return [`S TIER LEMONADE — NEW DELIVERY ORDER`, `Order: ${o.id}`, `Placed: ${new Date(o.createdAt).toLocaleString()}`, '', 'ITEMS:', ...o.items.map(p=>`${p.qty} x ${p.name} — ${money(p.price*p.qty)}`), '', `Subtotal: ${money(o.subtotal)}`, `Delivery: ${o.deliveryFee===0?'FREE':money(o.deliveryFee)}`, `TOTAL: ${money(o.total)}`, '', 'CUSTOMER:', `Name: ${o.name}`, `Phone: ${o.phone}`, `Address: ${o.address}`, `Town / Neighborhood: ${o.city}`, `ZIP: ${o.zip}`, `Preferred time: ${o.time}`, `Notes: ${o.notes||'None'}`, '', 'Payment: Cash at delivery'].join('\n')}
function renderReceipt(){const o=orders.find(x=>x.id===currentOrderId)||orders[0];if(!o){view='shop';return renderShop()}return `<section class="page"><div class="page-shell"><div class="receipt-top"><div class="receipt-check">✓</div><h2>Order created!</h2><p>Your order receipt is saved in this browser.</p><div class="receipt-id">${esc(o.id)}</div></div><div class="panel"><h3>What happens next?</h3><div class="notice">📩 <strong>One more step:</strong> send the order email so the stand can receive it. Your email app will open with the order details filled in. You must press <strong>Send</strong>; the app cannot send it automatically.</div><div class="order-card"><div class="order-head"><div><strong>${esc(o.name)}’s order</strong><div class="order-meta">${new Date(o.createdAt).toLocaleString()}<br>${esc(o.address)}, ${esc(o.city)} ${esc(o.zip)}</div></div><span class="status ${esc(statusClass(o.status))}">${esc(o.status)}</span></div><div class="order-items">${o.items.map(p=>`${p.qty} × ${esc(p.name)} — ${money(p.qty*p.price)}`).join('<br>')}</div>${totalsForOrder(o)}<div class="order-actions"><button class="primary" data-action="email-order" data-id="${o.id}">✉ Send order email</button><button class="secondary" data-action="copy-order" data-id="${o.id}">Copy order details</button></div>${!settings.email?'<p class="hint">The stand’s email is not set yet. Open Stand manager, enter an email address, and download a shareable app copy.</p>':''}</div><p class="hint">No payment was taken. Payment is cash at delivery. If the email app does not open, copy the order details and send them using your approved contact method.</p><button class="primary" data-action="shop-again">Back to the menu</button></div></section>`}
function totalsForOrder(o){return `<div class="totals"><div class="total-row"><span>Subtotal</span><strong>${money(o.subtotal)}</strong></div><div class="total-row"><span>Delivery</span><strong>${o.deliveryFee===0?'FREE':money(o.deliveryFee)}</strong></div><div class="total-row grand"><span>Total due at delivery</span><strong>${money(o.total)}</strong></div></div>`}
function renderOrders(){const own=orders.slice().reverse();return `<section class="page"><div class="page-shell"><h2 class="page-title">My orders 🧾</h2><p class="page-sub">Receipts created on this browser appear here. Orders made on another phone or computer will not appear here.</p>${own.length?own.map(o=>`<div class="order-card"><div class="order-head"><div><strong>${esc(o.id)} · ${money(o.total)}</strong><div class="order-meta">${new Date(o.createdAt).toLocaleString()}<br>${esc(o.name)} · ${esc(o.city)}</div></div><span class="status ${esc(statusClass(o.status))}">${esc(o.status)}</span></div><div class="order-items">${o.items.map(p=>`${p.qty} × ${esc(p.name)}`).join('<br>')}</div><div class="order-actions"><button class="secondary" data-action="view-order" data-id="${o.id}">View receipt</button><button class="secondary" data-action="email-order" data-id="${o.id}">Send order email</button></div></div>`).join(''):'<div class="panel empty-owner"><div style="font-size:38px">🧾</div><strong>No orders on this browser yet.</strong><p>When you place an order, its receipt will show up here.</p><button class="primary" data-view="shop">Browse lemonade</button></div>'}</div></section>`}
function renderOwner(){const all=orders.slice().reverse();const revenue=orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.total,0);return `<section class="page"><div class="page-shell"><h2 class="page-title">Stand manager 🛠️</h2><p class="page-sub">Configure this app and manage orders saved on this browser. For a public ordering page, download a shareable copy after configuring the email.</p><div class="notice">🌱 <strong>Delivery safety:</strong> Have a parent/guardian approve deliveries, contact details, and the delivery area before sharing this app with customers. This starter app only accepts cash at delivery.</div><div class="panel"><h3>Stand settings</h3><div class="toggle-row"><div><strong>${settings.open?'Stand is open':'Stand is closed'}</strong><small>${settings.open?'Customers can add items and check out.':'Ordering is paused.'}</small></div><button class="switch ${settings.open?'on':''}" data-action="toggle-open" aria-label="Toggle stand open status" aria-pressed="${settings.open}"></button></div><form id="settings-form"><div class="settings-grid"><div class="field full"><label for="settings-email">Order notification email</label><input id="settings-email" type="email" name="email" value="${esc(settings.email)}" placeholder="orders@example.com" /><span class="hint">A customer can open a pre-filled email after checkout. They still need to press Send.</span></div><div class="field"><label for="settings-fee">Delivery fee ($)</label><input id="settings-fee" type="number" name="deliveryFee" value="${Number(settings.deliveryFee)}" min="0" max="50" step="0.25" required /></div><div class="field"><label for="settings-free">Free delivery over ($)</label><input id="settings-free" type="number" name="freeDeliveryAt" value="${Number(settings.freeDeliveryAt)}" min="0" max="500" step="0.5" required /></div><div class="field"><label for="settings-min">Minimum order ($)</label><input id="settings-min" type="number" name="minimumOrder" value="${Number(settings.minimumOrder)}" min="0" max="100" step="0.5" required /></div></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:17px"><button class="primary" type="submit">Save settings</button><button class="secondary" type="button" data-action="export-app">Download shareable app</button></div></form><p class="hint" style="margin-top:14px">The shareable copy embeds your email and delivery settings. Customers use their own devices; their locally saved receipts will not appear in your manager. Order notifications are sent only when they press Send in their email app.</p></div><div class="section-heading"><div><h3>Order dashboard</h3><p>${orders.length} receipt${orders.length===1?'':'s'} saved on this browser</p></div><span class="pill">Total recorded: ${money(revenue)}</span></div>${all.length?all.map(o=>`<div class="order-card"><div class="order-head"><div><strong>${esc(o.id)} · ${money(o.total)}</strong><div class="order-meta">${new Date(o.createdAt).toLocaleString()}<br>${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.address)}, ${esc(o.city)} ${esc(o.zip)}</div></div><span class="status ${esc(statusClass(o.status))}">${esc(o.status)}</span></div><div class="order-items">${o.items.map(p=>`${p.qty} × ${esc(p.name)} — ${money(p.qty*p.price)}`).join('<br>')}<br><strong>Total: ${money(o.total)} · Cash due</strong>${o.notes?'<br>Notes: '+esc(o.notes):''}</div><div class="order-actions"><label class="hint" for="status-${o.id}">Update status:</label><select id="status-${o.id}" data-action="status-select" data-id="${o.id}">${['Pending','Preparing','Out for delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="secondary" data-action="email-order" data-id="${o.id}">Email details</button></div></div>`).join(''):'<div class="panel empty-owner">No orders yet. Once this browser creates receipts, they will appear here.</div>'}<div class="panel"><h3>Data tools</h3><p class="hint">Orders contain customer contact and delivery details. Only use a device managed by your family, do not share it publicly, and clear records when no longer needed.</p><div class="order-actions"><button class="secondary" data-action="export-csv" ${orders.length?'':'disabled'}>Export order list (CSV)</button><button class="secondary danger" data-action="clear-orders" ${orders.length?'':'disabled'}>Clear saved orders</button></div></div></div></section>`}
function render(){sync();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='shop')main.innerHTML=renderShop();else if(view==='checkout')main.innerHTML=renderCheckout();else if(view==='receipt')main.innerHTML=renderReceipt();else if(view==='orders')main.innerHTML=renderOrders();else if(view==='owner')main.innerHTML=renderOwner();window.scrollTo({top:0,behavior:'smooth'});}
function submitCheckout(form){if(!settings.open){toast('The stand is currently closed.');return}if(subtotal()<Number(settings.minimumOrder)){toast('Minimum order is '+money(settings.minimumOrder)+'.');return}const fd=new FormData(form);const o={id:'ST-'+Math.random().toString(36).slice(2,6).toUpperCase()+Date.now().toString().slice(-4),createdAt:new Date().toISOString(),status:'Pending',name:String(fd.get('name')||'').trim(),phone:String(fd.get('phone')||'').trim(),address:String(fd.get('address')||'').trim(),city:String(fd.get('city')||'').trim(),zip:String(fd.get('zip')||'').trim(),notes:String(fd.get('notes')||'').trim(),time:String(fd.get('time')||'As soon as possible'),items:allCart().map(p=>({id:p.id,name:p.name,qty:p.qty,price:p.price})),subtotal:subtotal(),deliveryFee:deliveryFee(),total:total()};if(!o.items.length)return;orders.push(o);cart={};currentOrderId=o.id;save(STORAGE.orders,orders);save(STORAGE.cart,cart);view='receipt';render()}
function emailOrder(id){const o=orders.find(x=>x.id===id);if(!o){toast('Order not found.');return}if(!settings.email||!settings.email.includes('@')){copyText(formatOrder(o));toast('Order details copied. Add an order email in Stand manager.');return}const subject=encodeURIComponent(`S Tier Lemonade order ${o.id}`);const body=encodeURIComponent(formatOrder(o));window.location.href=`mailto:${encodeURIComponent(settings.email)}?subject=${subject}&body=${body}`;toast('Email draft opened. Press Send in your email app.')}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove()}}
function exportCsv(){const rows=[['Order ID','Date','Status','Name','Phone','Address','Town','ZIP','Items','Subtotal','Delivery','Total','Preferred time','Notes'],...orders.map(o=>[o.id,o.createdAt,o.status,o.name,o.phone,o.address,o.city,o.zip,o.items.map(p=>`${p.qty} x ${p.name}`).join('; '),o.subtotal,o.deliveryFee,o.total,o.time,o.notes])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('stier-orders.csv',csv,'text/csv;charset=utf-8;')}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportConfiguredApp(){const email=String(settings.email||'').trim();if(!email||!email.includes('@')){toast('Enter a valid order email first.');document.getElementById('settings-email')?.focus();return}let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const replacements={DEFAULT_ORDER_EMAIL:JSON.stringify(email),DEFAULT_DELIVERY_FEE:String(Number(settings.deliveryFee)),DEFAULT_FREE_DELIVERY_AT:String(Number(settings.freeDeliveryAt)),DEFAULT_MINIMUM_ORDER:String(Number(settings.minimumOrder)),DEFAULT_STAND_OPEN:String(Boolean(settings.open))};for(const [key,value] of Object.entries(replacements)){const re=new RegExp('const '+key+' = (?:"(?:\\\\.|[^"\\\\])*"|[^;]+);');if(!re.test(html)){toast('Could not create a configured copy.');return}html=html.replace(re,'const '+key+' = '+value+';')}download('S-Tier-Lemonade-Delivery.html',html,'text/html;charset=utf-8');toast('Shareable copy downloaded!')}
document.querySelector('.app').addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.view){setView(btn.dataset.view);return}const a=btn.dataset.action;const id=btn.dataset.id;if(a==='add'){changeQty(id,1);toast('Added to your cart!')}else if(a==='qty'){changeQty(id,Number(btn.dataset.delta))}else if(a==='checkout'){if(!settings.open){toast('The stand is currently closed.');return}if(subtotal()<Number(settings.minimumOrder)){toast('Minimum order is '+money(settings.minimumOrder)+'. Add a little more lemonade!');return}setView('checkout')}else if(a==='go-cart'){if(view!=='shop')setView('shop');setTimeout(()=>document.getElementById('cart-box')?.scrollIntoView({behavior:'smooth',block:'center'}),80)}else if(a==='scroll-menu'){document.getElementById('menu-grid')?.scrollIntoView({behavior:'smooth',block:'start'})}else if(a==='shop-again'){setView('shop')}else if(a==='email-order'){emailOrder(id)}else if(a==='copy-order'){const o=orders.find(x=>x.id===id);if(o){copyText(formatOrder(o));toast('Order details copied.')}}else if(a==='view-order'){currentOrderId=id;setView('receipt')}else if(a==='toggle-open'){settings.open=!settings.open;sync();render();toast(settings.open?'Stand opened.':'Stand closed.')}else if(a==='export-app'){exportConfiguredApp()}else if(a==='export-csv'){exportCsv()}else if(a==='clear-orders'){if(confirm('Clear all orders saved on this browser? This cannot be undone.')){orders=[];save(STORAGE.orders,orders);render();toast('Saved orders cleared.')}}});
main.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='checkout-form'){if(!e.target.reportValidity())return;if(!document.getElementById('safe-area').checked){toast('Please confirm the delivery area.');return}submitCheckout(e.target)}else if(e.target.id==='settings-form'){const fd=new FormData(e.target);const fee=Number(fd.get('deliveryFee')),free=Number(fd.get('freeDeliveryAt')),min=Number(fd.get('minimumOrder'));if(!Number.isFinite(fee)||!Number.isFinite(free)||!Number.isFinite(min)||fee<0||free<0||min<0){toast('Please enter valid amounts.');return}settings={...settings,email:String(fd.get('email')||'').trim(),deliveryFee:fee,freeDeliveryAt:free,minimumOrder:min};sync();render();toast('Settings saved in this browser.')}});
main.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='status-select'){const o=orders.find(x=>x.id===el.dataset.id);if(o){o.status=el.value;sync();render();toast('Order status updated.')}}});
render();
</script>
</body>
</html>
